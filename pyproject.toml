[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ivmeg"
version = "0.1.0"
description = "Code to reproduce 'Intracranial Validation of Magnetoencephalography Across Oscillatory Frequency and Depth'"
requires-python = ">=3.10"
license = "BSD-3-Clause"

[tool.setuptools]
packages = ["ivmeg"]
